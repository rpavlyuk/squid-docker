#=============================
# SQUID CONFIGURATION (Fedora, PAM, TLS)
#=============================

# ---- PAM Auth ----
auth_param basic program /usr/lib64/squid/basic_pam_auth
auth_param basic children 5
auth_param basic realm Protected web cache
auth_param basic credentialsttl 2 hours

# ---- ACLs ----
acl localnet src 10.0.0.0/8           # RFC1918 LAN
acl localnet src 192.168.0.0/16       # RFC1918 LAN
acl localnet src fc00::/7             # RFC4193 local IPv6
acl localnet src fe80::/10            # RFC4291 link-local

# External authenticated clients
acl pam_auth proxy_auth REQUIRED !localnet !localhost

# ---- Ports ----
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 21
acl Safe_ports port 443
acl Safe_ports port 1025-65535
acl CONNECT method CONNECT

# ---- Access Rules ----

# Allow authenticated external clients
http_access allow pam_auth

# Allow local clients
http_access allow localnet
http_access allow localhost

# Block everything else
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny all

# ---- Management Access ----
http_access allow localhost manager
http_access deny manager
http_access deny to_localhost
http_access deny to_linklocal

# ---- Ports ----
http_port 3128

https_port 3129 cert=/etc/pki/tls/certs/domain.com.crt \
                key=/etc/pki/tls/private/domain.com.key

# ---- Cache and Storage ----
cache_dir ufs /var/spool/squid 100 16 256
coredump_dir /var/spool/squid

# ---- Refresh Patterns ----
refresh_pattern ^ftp:          1440    20%     10080
refresh_pattern -i (/cgi-bin/|\?) 0    0%      0
refresh_pattern .              0       20%     4320

# ---- Logging ----
access_log stdio:/var/log/squid/access.log squid
